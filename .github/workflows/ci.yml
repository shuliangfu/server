# CI: 9-job matrix — 3 Deno v2.9 + 3 Bun + 3 Node 22 (Linux/macOS/Windows)
# No Chromium, no Playwright, no external services
# All 13 test files are pure unit tests — no browser tests, no exclusions needed
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ───────────────── Deno ─────────────────
  test-deno:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts tests/

      - name: Check
        run: deno check src/mod.ts

      - name: Lint
        run: deno lint src/

      - name: Test (Deno)
        run: deno test -A --minimum-dependency-age=0 --no-check tests/

  # ───────────────── Bun ─────────────────
  test-bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        continue-on-error: true
        run: bun install || true

      - name: Test (Bun)
        run: bun test tests/

  # ───────────────── Node.js 22+ ─────────────────
  test-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Test (Node.js)
        run: node --import tsx --test-force-exit test-node.mjs
